<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>ghostty-web</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .terminal-window {
        width: 100%;
        max-width: 1000px;
        background: #1e1e1e;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .title-bar {
        background: #2d2d2d;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #1a1a1a;
      }

      .traffic-lights {
        display: flex;
        gap: 8px;
      }

      .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .light.red {
        background: #ff5f56;
      }

      .light.yellow {
        background: #ffbd2e;
      }

      .light.green {
        background: #27c93f;
      }

      .title {
        color: #e5e5e5;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .connection-status {
        margin-left: auto;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .connection-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #666;
      }

      .connection-dot.connected {
        background: #27c93f;
      }

      #terminal-container {
        height: 600px;
        padding: 16px;
        background: #1e1e1e;
        position: relative;
        overflow: hidden;
      }

      /* Ensure terminal canvas can handle scrolling */
      #terminal-container canvas {
        display: block;
      }

      @media (max-width: 768px) {
        body {
          padding: 20px 10px;
        }

        #terminal-container {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="terminal-window">
      <div class="title-bar">
        <div class="traffic-lights">
          <span class="light red"></span>
          <span class="light yellow"></span>
          <span class="light green"></span>
        </div>
        <div class="title">ghostty-web</div>
        <div class="connection-status">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-text">Disconnected</span>
        </div>
      </div>
      <div id="terminal-container"></div>
    </div>

    <script type="module">
      import { FitAddon } from '../lib/addons/fit.ts';
      import { init, Terminal } from '../lib/index.ts';

      let term;
      let ws;
      let fitAddon;
      let sessionReady = false;
      let bootstrapToken;

      async function initTerminal() {
        // Initialize WASM
        await init();

        term = new Terminal({
          cursorBlink: true,
          fontSize: 14,
          fontFamily: 'Monaco, Menlo, "Courier New", monospace',
          theme: {
            background: '#1e1e1e',
            foreground: '#d4d4d4',
          },
          scrollback: 10000,
        });

        fitAddon = new FitAddon();
        term.loadAddon(fitAddon);

        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        fitAddon.observeResize(); // Auto-fit when container resizes

        // Handle window resize (for browsers that don't trigger ResizeObserver on window resize)
        window.addEventListener('resize', () => {
          fitAddon.fit();
        });

        // Handle terminal resize
        term.onResize((size) => {
          if (sessionReady && ws && ws.readyState === WebSocket.OPEN) {
            // Send resize as control sequence (server expects this format)
            ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
          }
        });

        // Handle user input
        term.onData((data) => {
          if (sessionReady && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(data);
          }
        });

        // Debug scrollback
        console.log('Terminal scrollback:', term.buffer?.scrollback?.length || 'N/A');
        term.onScroll((ydisp) => {
          console.log('Scroll position:', ydisp);
        });

        // Connect to PTY server - terminal is ready immediately after open()
        console.log('[Demo] Terminal ready, connecting with size:', term.cols, 'x', term.rows);
        connectWebSocket();
      }

      function readBootstrapToken() {
        const params = new URLSearchParams(window.location.hash.slice(1));
        let token = params.get('token');
        if (token) {
          try {
            sessionStorage.setItem('ghostty-web-demo-token', token);
          } catch (_error) {
            // The in-memory token still works when storage is unavailable.
          }
          try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          } catch (_error) {
            // Referrer policy still prevents the fragment from being disclosed.
          }
        } else {
          try {
            token = sessionStorage.getItem('ghostty-web-demo-token');
          } catch (_error) {
            // Fall through to the missing-capability error.
          }
        }
        if (!token) throw new Error('Open the complete launch URL printed by the demo server');
        return token;
      }

      function buildWebSocketUrl() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        return `${protocol}//${window.location.host}/ws`;
      }

      function connectWebSocket() {
        sessionReady = false;

        let token;
        try {
          bootstrapToken ??= readBootstrapToken();
          token = bootstrapToken;
        } catch (error) {
          console.error('Authentication failed:', error);
          updateConnectionStatus(false, 'Auth error');
          return;
        }

        updateConnectionStatus(false, 'Connecting...');
        ws = new WebSocket(buildWebSocketUrl());

        ws.onopen = () => {
          console.log('WebSocket connected');
          updateConnectionStatus(false, 'Authenticating...');
          ws.send(
            JSON.stringify({
              type: 'authenticate',
              token,
              cols: term.cols,
              rows: term.rows,
            })
          );
        };

        ws.onmessage = (event) => {
          if (!sessionReady) {
            try {
              const message = JSON.parse(event.data);
              if (message.type === 'authenticated') {
                sessionReady = true;
                updateConnectionStatus(true);
                return;
              }
            } catch (_error) {
              // The server sends only the authentication acknowledgement first.
            }
          }
          // Server sends raw strings, not JSON
          term.write(event.data);
        };

        ws.onerror = (error) => {
          console.error('WebSocket error:', error);
          updateConnectionStatus(false, 'Error');
        };

        ws.onclose = (event) => {
          sessionReady = false;
          console.log('WebSocket disconnected');
          if (event.code === 1008) {
            updateConnectionStatus(false, 'Auth error');
            return;
          }
          updateConnectionStatus(false);

          // Attempt to reconnect after 3 seconds
          setTimeout(() => {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
              connectWebSocket();
            }
          }, 3000);
        };
      }

      function updateConnectionStatus(connected, message) {
        const dot = document.getElementById('connection-dot');
        const text = document.getElementById('connection-text');

        if (connected) {
          dot.classList.add('connected');
          text.textContent = message || 'Connected';
        } else {
          dot.classList.remove('connected');
          text.textContent = message || 'Disconnected';
        }
      }

      // Initialize on load
      initTerminal();
    </script>
  </body>
</html>
