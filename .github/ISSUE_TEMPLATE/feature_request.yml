name: Change proposal
description: Propose a focused compatibility or reliability outcome.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What observed limitation needs to change, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior and acceptance rather than a predetermined implementation.
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Upstream disposition
      options:
        - Likely useful upstream
        - hvir-specific compatibility
        - Already proposed upstream
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and alternatives
      description: Link related fork/upstream issues or pull requests and note alternatives considered.
