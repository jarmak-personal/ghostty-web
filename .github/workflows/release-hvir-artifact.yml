name: Release hvir artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvir-artifact-release
  cancel-in-progress: false

jobs:
  release:
    name: build and release hvir artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Snapshot current hvir-main revision
        id: source
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != 'refs/heads/hvir-main' ]]; then
            echo "::error::Run this workflow from hvir-main, received '$DISPATCH_REF'"
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub supplied an invalid source revision '$DISPATCH_SHA'"
            exit 1
          fi
          echo "commit=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out snapshotted source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ secrets.GHOSTTY_WEB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GHOSTTY_WEB_RELEASE_TOKEN is required to verify release immutability"
            exit 1
          fi
          enabled=$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')
          if [[ "$enabled" != 'true' ]]; then
            echo "::error::Enable immutable releases in repository settings before publishing an hvir artifact"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch hvir release history
        run: git fetch origin hvir-main:refs/remotes/origin/hvir-main --tags

      - name: Plan compatibility release
        id: release
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bun run scripts/hvir-release.ts plan

      - name: Check formatting
        run: bun run fmt

      - name: Run linter
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Build WASM for tests
        run: bun run build:wasm

      - name: Run tests
        run: bun test

      - name: Build and pack hvir package
        run: bun run pack:hvir

      - name: Check WASM size
        run: bun run scripts/check-wasm-size.ts

      - name: Validate release payload
        id: payload
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected one package tarball, found ${#tarballs[@]}"
            exit 1
          fi

          artifact=${tarballs[0]}
          checksum="${artifact}.sha256"
          provenance="${artifact}.provenance.json"
          for path in "$checksum" "$provenance"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing release payload $path"
              exit 1
            fi
          done

          mapfile -t payload_files < <(find artifacts -maxdepth 1 -type f -print)
          if [[ "${#payload_files[@]}" -ne 3 ]]; then
            echo "::error::Expected exactly three release payload files, found ${#payload_files[@]}"
            exit 1
          fi

          (cd artifacts && sha256sum --check "$(basename "$checksum")")

          ARTIFACT="$artifact" \
          CHECKSUM="$checksum" \
          GHOSTTY_COMMIT="$(git -C ghostty rev-parse HEAD)" \
          PROVENANCE="$provenance" \
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageMetadata = require('./package.json');
          const forkMetadata = require('./fork.json');
          const provenance = JSON.parse(fs.readFileSync(process.env.PROVENANCE, 'utf8'));
          const checksumSha = fs.readFileSync(process.env.CHECKSUM, 'utf8').split(/\s+/)[0];
          const expected = {
            artifact: path.basename(process.env.ARTIFACT),
            buildPlatform: 'linux-x64',
            ghosttyCommit: process.env.GHOSTTY_COMMIT,
            package: packageMetadata.name,
            packageVersion: process.env.PACKAGE_VERSION,
            sha256: checksumSha,
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRepository: `https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
            upstreamBranch: forkMetadata.upstreamBranch,
            upstreamCommit: forkMetadata.upstreamCommit,
            upstreamRepository: forkMetadata.upstreamRepository,
          };
          for (const [field, value] of Object.entries(expected)) {
            if (provenance[field] !== value) {
              throw new Error(`Provenance ${field} ${provenance[field]} does not match ${value}`);
            }
          }
          const expectedToolchain = {
            bun: '1.3.14',
            node: 'v24.18.0',
            npm: '11.16.0',
            zig: '0.15.2',
          };
          for (const [tool, version] of Object.entries(expectedToolchain)) {
            if (provenance.toolchain?.[tool] !== version) {
              throw new Error(
                `Unexpected ${tool} provenance: ${provenance.toolchain?.[tool]} (expected ${version})`,
              );
            }
          }
          NODE

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"

      - name: Create or resume immutable GitHub Release
        env:
          ARTIFACT: ${{ steps.payload.outputs.artifact }}
          CHECKSUM: ${{ steps.payload.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          PROVENANCE: ${{ steps.payload.outputs.provenance }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        run: bun run scripts/hvir-release.ts publish
