version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: hvir-main
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      bun-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
    ignore:
      # Vite 8 breaks the UMD/CommonJS Ghostty.load() path; keep receiving
      # compatible Vite 6 updates until the artifact smoke test can pass.
      - dependency-name: vite
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: hvir-main
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
